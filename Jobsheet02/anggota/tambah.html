<html>
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Daftar Anggota</title>
    <link rel="stylesheet" href="../assets/style.css">
</head>

<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <span> (Wajib Diisi)</span>
            <h2>Tambah Anggota</h2>
            <form method="POST" action="">
                <p> 
                    <label for="nama">Nama</label><br>
                    <input type="text" id="nama" name="nama_lengkap" required> 
                </p>
                <p>
                    <label for="nama">Email</label><br>
                    <input type="email" id="nama" name="nama" required>
                </p>
                <p>
                    <label for="no_anggota">No.anggota</label><br>
                    <input type="text" id="no_anggota" name="no_anggota" required>
                </p>
                <p>
                    <label for="tanggal_lahir">Tanggal Lahir</label><br>
                    <input type="datetime-local" value="dd/mm/yyyy hh:mm:ss" id="tanggal_lahir" name="tanggal_lahir" required>
                </p>
                <p>
                    <label for="almat">Alamat</label><br>
                    <textarea id="alamat" rows="10" cols="30" name="alamat"></textarea>
                    <input type="text" id="alamat" name="alamat">
                </p>
                <p>
                    <label for="no_hp">No HP</label>
                    <input type="number" id="no_hp" name="no_hp">
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>
</body>
</html>
