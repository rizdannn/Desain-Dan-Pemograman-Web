<html>
    <!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIMPUS-Mini | Daftar Buku</title>
</head>

<body>
    <header>
        <h1>SIMPUS-Mini</h1>
        <nav>
            <ul>
                <li><a href="../index.html">Beranda</a></li>
                <li><a href="list.html">Daftar Buku</a></li>
                <li><a href="tambah.html">Tambah Buku</a></li>
                <li><a href="../anggota/list.html">Daftar Anggota</a></li>
            </ul>
        </nav>
    </header>
    <main>
        <section>
            <span> (Wajib Diisi)</span>
            <h2>Tambah Anggota</h2>
            <form method="POST" action="">
                <p> 
                    <label for="judul">Judul<span style="color:red">Wajib</span></label><br>
                    <input type="text" id="judul" name="judul" required> 
                </p>
                <p>
                    <label for="pengarang">Pengarang</label><br>
                    <input type="text" id="pengarang" name="pengarang" required>
                </p>
                <p>
                    <label for="tahun">Tahun Terbit</label><br>
                    <input type="number" id="tahun" name="tahun" min="1900" max="2026" required>
                </p>
                <p>
                    <label for="isbn">ISBN</label><br>
                    <input type="text "id="isbn" name="isbn" required>
                </p>
                <p>
                    <label for="stok">Stok</label><br>
                    <input type="number" id="stok"  name="stok" min="0">
                </p>
                <p>
                    <label for="kategori">Kategori</label>
                    <select id="kategori" name="kategori">
                        <option value="fiksi"></option>
                        <option value="non fiksi"></option>
                        <option value="referensi"></option>
                    </select>
                </p>
                <p>
                    <button type="submit">Simpan</button>
                </p>
            </form>
        </section>
    </main>
</body>
